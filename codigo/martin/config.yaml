# Martin tile server config: publishes ONLY the read-only map views
# (map_incidents, map_detentions, map_cantons) -- never the raw tables, and
# never anything auto-discovered. See
# migrations/versions/*_admin_units_and_map_views.py and
# migrations/versions/*_canton_indicators_and_map_cantons_view.py for the
# views themselves and app/database/views.py for the API's matching Core
# table definitions.
listen_addresses: '0.0.0.0:3000'

# Dev only: the frontend is served from a different origin (Vite on 5173).
cors: true

postgres:
  connection_string: ${DATABASE_URL}
  auto_publish: false

  tables:
    map_incidents:
      schema: public
      table: map_incidents
      srid: 4326
      geometry_column: geom
      geometry_type: POINT
      id_column: id
      properties:
        type: text
        confidence: text
        year: int4
        month: int4
        province_code: text
        canton_code: text

    map_detentions:
      schema: public
      table: map_detentions
      srid: 4326
      geometry_column: geom
      geometry_type: POINT
      id_column: id
      properties:
        year: int4
        month: int4
        province_code: text
        canton_code: text
        detention_type: text

    # First polygon layer: no id_column -- a canton has no natural integer
    # id ('code' is a 4-char string) -- the frontend keys feature-state off
    # the 'code' tile property instead (MapLibre's `promoteId: 'code'`).
    map_cantons:
      schema: public
      table: map_cantons
      srid: 4326
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      properties: { code: text, name: text, province_code: text }
