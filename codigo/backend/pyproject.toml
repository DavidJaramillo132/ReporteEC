[project]
name = "reportec-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DavidJaramillo132", email = "djdavidjaramillo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Autogenerated by Alembic; reformatting/relinting them defeats the point of a
# migration diff, and every new revision would trip the same rules again.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own dependency-injection idiom: a `Depends(...)`/`Query(...)` call
# as a parameter default is required, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
