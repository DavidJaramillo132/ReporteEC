name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo/backend
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: reporteec
          POSTGRES_PASSWORD: reporteec
          POSTGRES_DB: reporteec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reporteec -d reporteec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://reporteec:reporteec@localhost:5432/reporteec
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc -b

      - name: Test
        run: bunx vitest run

      - name: Build
        run: bun run build

  build-prod-images:
    # Validates the production images build on every push, without pushing
    # them anywhere -- see codigo/despliegue/README.md for the actual deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend prod image
        uses: docker/build-push-action@v6
        with:
          context: codigo/backend
          target: prod
          push: false

      - name: Build Caddy (frontend build + reverse proxy) image
        uses: docker/build-push-action@v6
        with:
          context: codigo
          file: codigo/despliegue/Caddy.Dockerfile
          push: false
